<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App Beta Test</title>
  <style>
    body {
      background-color: #0f172a;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: sans-serif;
    }

    /* iPhone Frame */
    .phone-container {
      width: 375px;
      height: 812px;
      max-height: 90vh;
      border: 12px solid #1f2937;
      border-radius: 44px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      overflow: hidden;
      background: #000;
    }

    /* Flutter App inside the phone */
    .phone-container iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <div class="phone-container">
    <iframe src="index.html"></iframe>
  </div>

</body>
</html>
